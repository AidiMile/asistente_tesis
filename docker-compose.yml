services:
  db:
    image: postgres:15-alpine
    container_name: postgres_tesis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes configurar POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-asistente_db}
    # Puerto interno 5432 aislado: no se publica hacia el host para máxima seguridad
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asistente_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_nlp_ec
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/setup_models.sh" ]
    # Puerto interno 11434 aislado: comunicación exclusiva dentro de la red Docker privada
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama/Modelfile:/Modelfile:ro
      - ./ollama/setup_models.sh:/setup_models.sh:ro
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: 2048
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/model-ready && ollama list >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 20s

  backend:
    build: ./backend
    container_name: django_asistente_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_modismos &&
             python manage.py ensure_admin &&
             (python manage.py warm_up_model &) &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180"
    volumes: [ "./backend:/app" ]
    ports: [ "127.0.0.1:8000:8000" ]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY en el archivo .env}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-asistente_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes configurar POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plnec.ec}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en el archivo .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administradoras PLN-EC}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db: { condition: service_healthy }
      ollama: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/api/health/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: angular_asistente_frontend
    restart: unless-stopped
    ports: [ "127.0.0.1:8080:80" ]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data:
    name: asistente_postgres_data
  ollama_models:
    name: asistente_ollama_models
