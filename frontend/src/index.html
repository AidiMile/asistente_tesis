<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Asistente Virtual PLN-EC | UPEC</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Script prevent FOUC / Inicializar tema -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('pln_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
  <app-root></app-root>
</body>
</html>
